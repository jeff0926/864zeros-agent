name: 864zeros Agent

on:
  # Run on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

  # Run when tasks.json is updated
  push:
    paths:
      - 'queue/tasks.json'

  # Manual trigger
  workflow_dispatch:
    inputs:
      task:
        description: 'Optional task override'
        required: false
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "864zeros Agent"
          git config user.email "agent@864zeros.com"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python scripts/agent.py

      - name: Push changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "Agent run: $(date -u +%Y-%m-%d_%H:%M)"
          git push
