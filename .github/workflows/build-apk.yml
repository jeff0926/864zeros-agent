name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'task-breakdown-ai/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      anthropic_api_key:
        description: 'Anthropic API Key (optional - leave empty for fallback mode)'
        required: false
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-breakdown-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean and install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Create .env file
        run: |
          if [ -n "${{ github.event.inputs.anthropic_api_key }}" ]; then
            echo "ANTHROPIC_API_KEY=${{ github.event.inputs.anthropic_api_key }}" > .env
          else
            echo "ANTHROPIC_API_KEY=" > .env
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskBreakdownAI-debug
          path: task-breakdown-ai/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get APK info
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "### APK Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
